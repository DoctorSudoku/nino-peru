<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

  .wrap { max-width: 640px; margin: 0 auto; padding: 18vh 1.5rem 4rem; }
  .kicker { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:#b3261e; font-weight:700; }
  h1 { font-family: "Iowan Old Style", Georgia, serif; font-size: clamp(1.8rem, 4vw, 2.6rem); margin:.6rem 0 .8rem; line-height:1.1; }
  p { color:#47505c; }
  a { display:inline-block; margin-top:1.2rem; padding:.5rem 1rem; border:1px solid #e3e0d8; border-radius:8px;
      background:#fff; color:#14181d; text-decoration:none; font-weight:600; font-size:.88rem; }
  a:hover { border-color:#6d7683; }
  @media (prefers-color-scheme: dark) {
    body { background:#0d1117; color:#eef1f5; }
    p { color:#aab4c0; }
    a { background:#151b23; border-color:#262e39; color:#eef1f5; }
  }

</head>
<body>
